name: packages

# Builds the MatePad packages (packaging/) and publishes the apt repository
# (release "apt"). Started by hand: Actions > packages > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 600
    env:
      WORK: /mnt/matepad-packages
      KERNEL_REPO: svesnav/linux-dby-w09
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the package versions count commits

      - name: Install the builder's tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap apt-utils gnupg
          if [ "$(uname -m)" != aarch64 ]; then
            sudo apt-get install -y -qq qemu-user-static binfmt-support
            ls /proc/sys/fs/binfmt_misc/ | grep -q aarch64
          fi

      - name: Package versions
        run: sh packaging/versions.sh | tee packaging/versions.env

      - name: The published index (unchanged packages are not rebuilt)
        run: |
          mkdir -p /tmp/published && cd /tmp/published
          gh release download apt -p Packages 2>/dev/null || : > Packages
          grep -E '^(Package|Version):' Packages | paste - - || true

      - name: Build the packages
        run: |
          sudo mkdir -p "$WORK" && sudo rm -rf "$WORK/out"
          sudo WORK="$WORK" bash packaging/build-chroot.sh "$WORK/out" /tmp/published/Packages
          sudo chown -R "$(id -u):$(id -g)" "$WORK/out"

      - name: Publish the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: bash packaging/publish-repo.sh "$WORK/out"
