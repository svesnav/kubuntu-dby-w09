# /etc/systemd/system/systemd-suspend.service.d/matepad.conf
# Suspend through matepad-suspend instead of systemd-sleep: it prepares the
# hardware and stays asleep through background wakes until the power key or
# the cover wakes the tablet (see /usr/local/sbin/matepad-suspend).
[Service]
ExecStart=
ExecStart=/usr/local/sbin/matepad-suspend
