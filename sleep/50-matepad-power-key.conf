# /etc/systemd/logind.conf.d/50-matepad-power-key.conf
# Plasma (PowerDevil) handles the power key: "Turn off screen". Closing the
# cover sends the same key press (matepad-volkeys). Without a desktop, logind
# would power the tablet off on either; ignore them instead (holding the
# power key for >10 s still forces a restart).
[Login]
HandlePowerKey=ignore
