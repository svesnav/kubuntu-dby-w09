# Routing is set with the verb, as on 4.19: PipeWire/ACP probes the PCMs
# with only the verb enabled, and an unrouted front end fails to open
# ("ASoC: no backend DAIs enabled").
#  - speakers: MultiMedia1 (PCM 0) -> PRIMARY_TDM_RX_0. Format (4 x S32_LE)
#    and slots come from the machine driver (sound/sm8250-pri-tdm.py).
#  - mics: Huawei's "speaker-mic" path from the 4.19 profile: the four analog
#    mics on the WCD938x ADC1-4 -> TX decimators 0-3 -> TX_CODEC_DMA_TX_3
#    (4 channels) -> MultiMedia2 capture (PCM 1: upstream q6asm-dai has one
#    DSP session per front end, so capture on MultiMedia1 next to the
#    speakers failed with ASM error 9). ADC gain 12 as Huawei, decimators
#    +12 dB (96). Upstream also needs the per-ADC SoundWire port switches
#    ("ADCn Switch").
SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"

		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC2"
		cset "name='ADC2 MUX' INP3"
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX SMIC MUX2' ADC1"
		cset "name='ADC3 MUX' INP4"
		cset "name='TX DEC3 MUX' SWR_MIC"
		cset "name='TX SMIC MUX3' ADC3"
		cset "name='ADC4 MUX' INP5"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX_DEC1 Volume' 96"
		cset "name='TX_DEC2 Volume' 96"
		cset "name='TX_DEC3 Volume' 96"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC2 Volume' 12"
		cset "name='ADC3 Volume' 12"
		cset "name='ADC4 Volume' 12"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_AIF1_CAP Mixer DEC2' 1"
		cset "name='TX_AIF1_CAP Mixer DEC3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# 4 channels = 4 TDM slots; the amps play slot 0 or 1 (matepad-tfa9874
# follows the orientation), see the WirePlumber rule for the channel names.
SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}

# Channel 1 is the rear mic (next to the camera), 0/2/3 the top edge
# (4.19 tap test); the WirePlumber rule labels them FL,RC,FC,FR.
SectionDevice."Mic" {
	Comment "Internal Microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 4
	}
}
