# MatePad 11 (DBY-W09) on Linux 7.0: upstream "sm8250" ASoC card (q6 APR on
# the ADSP), installed as /usr/share/alsa/ucm2/conf.d/sm8250/<card long name>.
# Speakers: four TFA9874 amps on PRIMARY TDM, powered by
# matepad-tfa9874.service while PCM 0 plays. Microphones: four analog mics
# on the WCD938x (SoundWire), captured on PCM 1 (MultiMedia2).
SectionUseCase."HiFi" {
	File "/conf.d/sm8250/Huawei-MatePad-11-DBY-W09-HiFi.conf"
	Comment "Play HiFi quality Music"
}
