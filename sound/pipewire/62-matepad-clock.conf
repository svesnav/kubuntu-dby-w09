# /etc/pipewire/pipewire.conf.d/62-matepad-clock.conf
# Smallest graph quantum. Even with api.alsa.headroom = 2048 the q6 PCMs
# (speakers, HDMI) re-triggered and clicked at quantum 32 (PipeWire's
# default minimum, ~1500 timer wake-ups per second); 64 and up ran clean.
# 128 (2.7 ms) leaves a margin; nothing on the tablet needs less.
context.properties = {
    default.clock.min-quantum = 128
}
