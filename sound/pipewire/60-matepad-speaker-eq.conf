# MatePad 11 speakers: what Huawei's ADSP processing would otherwise do.
# Ubuntu sends the plain signal to the four TFA9874 amps (fixed 17 dB gain,
# no speaker protection), and loud music distorted ("crackles"). This sink
# ("Speakers", the default output) filters before the hardware sink:
#   - a 24 dB/octave high-pass at 200 Hz: the tiny speakers cannot reproduce
#     deep bass, and trying to was the main source of the distortion;
#   - a look-ahead limiter at -1 dBFS (swh-plugins), so no peak overdrives
#     the amps however loud the source is.
# It plays stereo into the hardware sink's FL/FR (= TDM slots 0/1, which
# matepad-smartpa routes to the left/right speaker pairs by orientation).
context.modules = [
    {   name = libpipewire-module-filter-chain
        # a broken filter must not take the whole sound server down
        flags = [ nofail ]
        args = {
            node.description = "Speakers"
            media.name       = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpl1 label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hpl2 label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hpr1 label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hpr2 label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
                    {   type   = ladspa
                        name   = limiter
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.08 }
                    }
                ]
                links = [
                    { output = "hpl1:Out" input = "hpl2:In" }
                    { output = "hpr1:Out" input = "hpr2:In" }
                    { output = "hpl2:Out" input = "limiter:Input 1" }
                    { output = "hpr2:Out" input = "limiter:Input 2" }
                ]
                inputs  = [ "hpl1:In" "hpr1:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "matepad_speakers"
                media.class      = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
                device.icon-name = "audio-speakers"
            }
            playback.props = {
                node.name           = "matepad_speakers.output"
                node.passive        = true
                node.dont-reconnect = true
                stream.dont-remix   = true
                target.object       = "alsa_output.platform-soc_qcom_msm-audio-apr_qcom_q6core-audio_sound.HiFi__hw_konaqrdsndcard_0__sink"
            }
        }
    }
]
