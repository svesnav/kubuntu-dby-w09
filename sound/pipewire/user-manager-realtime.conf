# /etc/systemd/user.conf.d/matepad-realtime.conf
# The user manager starts its services (pipewire, pipewire-pulse) with its
# default limits; with only user@1000.service raised they still got RTPRIO 0.
# PipeWire's module-rt needs both: rtprio for SCHED_FIFO and nice for -11,
# else it falls back to RTKit (not installed).
[Manager]
DefaultLimitRTPRIO=95
DefaultLimitNICE=-19
DefaultLimitMEMLOCK=4M
