# MatePad: real-time audio for regular users (UID 1000 and up).
# /usr/lib/pam.d/systemd-user runs pam_limits, which resets the user
# manager (user@1000.service) to PID 1 limits (rtprio 0, nice 0) and so
# undoes LimitRTPRIO/LimitNICE from the user@1000 drop-in. Without these
# PipeWire module-rt falls back to RTKit (not installed) and the audio
# threads run as ordinary threads. Same values as 25-pw-rlimits.conf;
# memlock is left alone (user.conf.d sets 4M for the user services).
1000:    -   rtprio   95
1000:    -   nice     -19
