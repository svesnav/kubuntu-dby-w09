# /etc/systemd/user/filter-chain.service.d/matepad-wait-sink.conf
# The "Speakers" filter (60-matepad-speaker-eq.conf) plays into the ALSA
# speaker sink with node.dont-reconnect, so when filter-chain starts before
# WirePlumber has created that sink (2-3 s after pipewire at boot, the card
# comes up through UCM), WirePlumber drops the unlinkable stream and the
# module unloads itself: no "Speakers" sink for the whole session (first
# fresh boot with real-time audio, 2026-10-21; also after restarting
# pipewire by hand). Wait up to 30 s for the sink first.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 60 ]; do pw-cli ls Node 2>/dev/null | grep -q "konaqrdsndcard_0__sink" && exit 0; i=$$((i+1)); sleep 0.5; done; echo "speaker sink not there after 30 s" >&2'
TimeoutStartSec=60
