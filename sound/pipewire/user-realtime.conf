# /etc/systemd/system/user@.service.d/matepad-realtime.conf
# PipeWire's audio threads ran as ordinary threads (TS, nice 0): RTKit is not
# installed and the user had no real-time limit, so 4K video in Brave
# (~80 % CPU) delayed them and the sound lagged and crackled. With these
# limits PipeWire's module-rt sets SCHED_FIFO itself (no RTKit needed); the
# same values as Ubuntu's /etc/security/limits.d/25-pw-rlimits.conf.
[Service]
LimitRTPRIO=95
LimitNICE=-19
LimitMEMLOCK=4M
